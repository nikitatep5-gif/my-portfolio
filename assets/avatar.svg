<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGrad)" opacity="0.15" />
  <circle cx="200" cy="200" r="160" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Body / Hoodie -->
  <path d="M 120 360 C 120 280, 150 250, 200 250 C 250 250, 280 280, 280 360 Z" fill="url(#hoodieGrad)"/>
  <path d="M 175 250 L 200 295 L 225 250 Z" fill="#334155"/>
  <circle cx="195" cy="305" r="4" fill="#94a3b8"/>
  <circle cx="205" cy="305" r="4" fill="#94a3b8"/>

  <!-- Neck -->
  <rect x="182" y="215" width="36" height="42" rx="10" fill="#fbcfe8"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="55" ry="62" fill="#fed7aa"/>

  <!-- Hair -->
  <path d="M 145 170 C 145 110, 255 105, 255 170 C 255 140, 240 120, 200 120 C 160 120, 148 145, 145 170 Z" fill="#1e1b4b"/>
  <path d="M 148 165 C 140 185, 150 215, 155 200 C 158 185, 155 170, 148 165 Z" fill="#1e1b4b"/>
  <path d="M 252 165 C 260 185, 250 215, 245 200 C 242 185, 245 170, 252 165 Z" fill="#1e1b4b"/>

  <!-- Glasses -->
  <rect x="156" y="165" width="36" height="24" rx="8" fill="none" stroke="#0f172a" stroke-width="5"/>
  <rect x="208" y="165" width="36" height="24" rx="8" fill="none" stroke="#0f172a" stroke-width="5"/>
  <line x1="192" y1="177" x2="208" y2="177" stroke="#0f172a" stroke-width="5"/>
  <line x1="145" y1="175" x2="156" y2="175" stroke="#0f172a" stroke-width="4"/>
  <line x1="244" y1="175" x2="255" y2="175" stroke="#0f172a" stroke-width="4"/>

  <!-- Eyes behind glasses -->
  <circle cx="174" cy="177" r="4" fill="#0f172a"/>
  <circle cx="226" cy="177" r="4" fill="#0f172a"/>

  <!-- Smile -->
  <path d="M 188 206 Q 200 218 212 206" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Cheeks -->
  <ellipse cx="164" cy="200" rx="8" ry="4" fill="#f43f5e" opacity="0.3"/>
  <ellipse cx="236" cy="200" rx="8" ry="4" fill="#f43f5e" opacity="0.3"/>

  <!-- Headphones -->
  <path d="M 135 175 A 65 65 0 0 1 265 175" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <rect x="130" y="160" width="16" height="34" rx="8" fill="#0284c7"/>
  <rect x="254" y="160" width="16" height="34" rx="8" fill="#0284c7"/>
</svg>
