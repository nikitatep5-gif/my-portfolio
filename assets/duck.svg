<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="duckYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="beakOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Duck Body -->
  <path d="M 60 120 C 60 80, 110 80, 130 110 C 150 100, 185 110, 175 145 C 165 175, 95 185, 65 160 C 55 150, 60 135, 60 120 Z" fill="url(#duckYellow)" stroke="#ca8a04" stroke-width="3"/>

  <!-- Duck Wing -->
  <path d="M 90 125 C 110 125, 140 135, 135 155 C 120 165, 95 155, 90 125 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>

  <!-- Duck Head -->
  <circle cx="75" cy="80" r="35" fill="url(#duckYellow)" stroke="#ca8a04" stroke-width="3"/>

  <!-- Beak -->
  <path d="M 45 80 C 20 85, 20 95, 45 98 Z" fill="url(#beakOrange)" stroke="#c2410c" stroke-width="2"/>

  <!-- Eye -->
  <circle cx="68" cy="72" r="6" fill="#1e293b"/>
  <circle cx="66" cy="70" r="2" fill="#ffffff"/>

  <!-- Blush -->
  <ellipse cx="78" cy="88" rx="6" ry="3" fill="#f87171" opacity="0.5"/>

  <!-- Water ripples -->
  <path d="M 30 175 C 60 170, 80 180, 110 175 C 140 170, 160 180, 180 175" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
</svg>
