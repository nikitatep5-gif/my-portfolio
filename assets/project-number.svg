<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="numBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e17" />
      <stop offset="100%" stop-color="#1a2e22" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#numBg)" />

  <!-- Grid pattern -->
  <g opacity="0.1" stroke="#bef264" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="360" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="180" y1="0" x2="180" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="420" y1="0" x2="420" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="540" y1="0" x2="540" y2="360" />
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
  </g>

  <!-- Number card display -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="55" width="460" height="250" rx="14" fill="#0f1912" stroke="#2d4234" stroke-width="2"/>
    <!-- Result pill -->
    <rect x="110" y="85" width="380" height="110" rx="10" fill="url(#limeGrad)"/>
    <text x="300" y="165" font-family="'DM Mono', monospace, sans-serif" font-size="78" font-weight="700" fill="#141e17" text-anchor="middle" letter-spacing="-2">42</text>
    
    <!-- Controls mock -->
    <rect x="110" y="220" width="100" height="42" rx="6" fill="#1e2e22" stroke="#37523e" stroke-width="1.5"/>
    <text x="160" y="247" font-family="monospace" font-size="14" fill="#a3e635" text-anchor="middle">MIN: 1</text>

    <rect x="230" y="220" width="100" height="42" rx="6" fill="#1e2e22" stroke="#37523e" stroke-width="1.5"/>
    <text x="280" y="247" font-family="monospace" font-size="14" fill="#a3e635" text-anchor="middle">MAX: 100</text>

    <rect x="350" y="220" width="140" height="42" rx="6" fill="#84cc16"/>
    <text x="420" y="246" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f1912" text-anchor="middle">ROLL DICE ⚄</text>
  </g>
</svg>
