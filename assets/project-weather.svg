<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#skyGrad)" />

  <!-- Sun -->
  <circle cx="430" cy="130" r="65" fill="url(#sunGrad)"/>

  <!-- Clouds -->
  <path d="M 120 230 C 120 185, 160 170, 190 180 C 210 145, 270 145, 290 180 C 320 175, 350 205, 340 235 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M 280 250 C 280 205, 320 195, 345 205 C 365 175, 415 175, 435 205 C 460 200, 485 225, 475 255 Z" fill="#e0f2fe" opacity="0.85"/>

  <!-- Temperature readout badge -->
  <rect x="80" y="70" width="160" height="75" rx="12" fill="rgba(255, 255, 255, 0.2)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5"/>
  <text x="110" y="125" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="700" fill="#ffffff">72°</text>
  <text x="175" y="105" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#bae6fd">SUNNY</text>
  <text x="175" y="125" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#e0f2fe">CALIFORNIA</text>
</svg>
